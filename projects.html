<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects · Athena Saghi</title>
<meta name="description" content="Research projects by Athena Saghi on how people work with AI, how AI changes the mind, and how to align AI with human cognition.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Baskervville:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Projects: a simple grid of cards, each with an image, the question, a short summary, and a link to the paper when published.
   To add an image to a card, put the file in assets/projects/ and add img:'assets/projects/NAME.jpg' to that project below. */
.intro{padding:clamp(40px,7vw,90px) 0 clamp(28px,4vw,44px)}
.intro h1{margin:0 0 14px;font-weight:300;font-size:clamp(40px,6vw,72px);letter-spacing:-.02em;line-height:1}
.intro p{margin:0;max-width:36em;color:var(--soft);font-size:19px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 0}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--soft);border-radius:999px;padding:6px 14px;cursor:pointer}
.filters button span{font-family:var(--mono);font-size:11px;margin-right:6px;color:var(--faint)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button[aria-pressed="true"] span{color:inherit;opacity:.7}

.desk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:clamp(24px,3.4vw,44px);padding:clamp(20px,3vw,36px) 0 40px}
.sheet{position:relative;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:6px;padding:20px 22px 22px;scroll-margin-top:30px;transition:border-color .2s ease,background .2s ease}
.sheet:hover{border-color:color-mix(in srgb,var(--ink) 35%,transparent);background:#fff}
.sheet:target{border-color:var(--accent)}
.sheet[hidden]{display:none}
.sheet header{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.sheet .ph{display:grid;place-items:center;width:100%;aspect-ratio:16/9;margin:14px 0 16px;border-radius:4px;border:1px solid var(--line);object-fit:cover;
  background:repeating-linear-gradient(135deg,rgba(43,50,64,.035) 0 10px,transparent 10px 20px),rgba(250,248,244,.6)}
.sheet .ph span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sheet .paper{display:inline-flex;gap:6px;margin-top:14px;font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px}
.sheet .paper:hover{color:var(--accent)}
.sheet h2{margin:0 0 10px;font-weight:400;font-size:21px;line-height:1.25;letter-spacing:-.005em}
.sheet .q{margin:0 0 12px;font-size:18px;line-height:1.4;color:var(--ink)}
.sheet p.d{margin:0 0 14px;font-size:15px;line-height:1.6;color:var(--soft)}
.sheet .tags{display:flex;flex-wrap:wrap;gap:6px}
.sheet .tags span{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;color:var(--soft)}
.sheet .au{margin:12px 0 0;font-size:12.5px;color:var(--faint);line-height:1.5}
.sheet .au b{font-weight:500;color:var(--soft)}
.group-note{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding:18px 0 10px;margin-top:10px}
.group-note .num{font-size:22px}
.group-note h3{margin:0;font-weight:400;font-size:22px}
.group-note[hidden]{display:none}
</style>
</head>
<body>
<div class="wash" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<nav class="site-nav wrap" aria-label="Site">
  <a class="home" href="index.html">Athena Saghi</a>
  <a class="mid" href="projects.html" aria-current="page">Projects</a>
  <span class="right"><a href="about.html">About</a></span>
</nav>

<main class="wrap">
  <section class="intro">
    <h1>Projects</h1>
    <p>Each card is one project: the question it started from, what I did, and where it stands.</p>
    <div class="filters" role="group" aria-label="Filter projects">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="1" aria-pressed="false"><span>001</span>How people work with AI</button>
      <button type="button" data-f="2" aria-pressed="false"><span>002</span>How AI changes the mind</button>
      <button type="button" data-f="3" aria-pressed="false"><span>003</span>Aligning AI with cognition</button>
      <button type="button" data-f="0" aria-pressed="false"><span>000</span>Earlier work</button>
    </div>
  </section>
  <section class="desk" id="desk" aria-live="polite"></section>
  <footer class="site-foot"><span>© 2026 Athena Saghi</span><span>Last updated: October 19, 2026</span></footer>
</main>

<script src="assets/site.js"></script>
<script>
const ME='<b>Saghi, Z.</b>';
const GROUPS={1:'How people work with AI',2:'How AI changes the mind',3:'Aligning AI with human cognition',0:'Earlier work'};
const P=[
 {id:'biases',g:1,url:'https://arxiv.org/abs/2601.08045',ven:'ICSE 2026',t:'Cognitive biases in LLM-assisted software development',q:'Do LLM assistants make developers’ cognitive biases louder?',
  d:'Mixed-methods and controlled observational studies of developers working with LLM assistants, measuring critical thinking, cognitive load and how existing biases get amplified.',tags:['mixed methods','observational study','cognitive bias'],au:ME+', Zhou, X., Sabouri, S., Pandita, R., McGuire, M., & Chattopadhyay, S.'},
 {id:'mentalmodels',g:1,ven:'Under review',t:'“Do as I say, not as I code?”',q:'Why do developers describe AI one way and use it another?',
  d:'How developers’ mental models of AI diverge from their actual practice, and what that gap means for the design of coding assistants.',tags:['interviews','mental models','programming'],au:ME+', & Chattopadhyay, S.'},
 {id:'paperreading',g:1,url:'https://aceatusc.github.io/surf',ven:'UIST 2025',t:'Beyond the page',q:'What if a research paper came with the conversation around it?',
  d:'A reading system that enriches academic papers with social media discussions, placing community commentary next to the passages it is about.',tags:['system','reading','UIST'],au:'Huang, R., Zhao, A. K., '+ME+', Sabouri, S., & Chattopadhyay, S.'},
 {id:'spreadsheets',g:1,ven:'Under review',t:'Auditing and controlling AI agent actions in spreadsheets',q:'How do people stay in control when an agent edits their data?',
  d:'Tools for auditing and steering what an AI agent does inside a spreadsheet, so users can see, check and undo its actions.',tags:['agents','end-user programming','control'],au:'Sabouri, S., '+ME+', Huang, R., Maladi, S., Eufracio, E., Gulwani, S., & Chattopadhyay, S.'},
 {id:'creativecode',g:2,ven:'Under revision',t:'“Like taking the path of least resistance”',q:'Does autocomplete pull programmers onto the path of least resistance?',
  d:'How interacting with LLMs changes the creative process of programming: which ideas get explored, and which ones never get written.',tags:['creativity','think-aloud','programming'],au:ME+', Huang, R., & Chattopadhyay, S.'},
 {id:'genai',g:2,ven:'In submission',t:'Generative AI and brain connectivity',q:'Does working with generative AI change how the brain connects during creative work?',
  d:'Within-subject EEG studies with a wearable DSI-24 headset, quantifying how generative AI use alters functional brain connectivity during creative and cognitive tasks.',tags:['EEG','DSI-24','within-subject'],au:ME+' et al.'},
 {id:'flow',g:2,ven:'Ongoing',t:'Neural signatures of creative flow',q:'Can we predict creative flow from neural signals, and protect it?',
  d:'Predictive models of creativity-related neural signatures, built to time real-time interventions that sustain engagement and creative flow.',tags:['EEG','prediction','creativity'],au:ME+' et al.'},
 {id:'thinkaloud',g:3,ven:'Under review',t:'Surfacing latent reasoning gaps',q:'Can an agent hear the gap in someone’s reasoning and nudge at the right moment?',
  d:'A real-time agentic system that ingests think-aloud speech while people write, monitors their reasoning, predicts gaps and delivers contextualized nudges.',tags:['agentic AI','speech','writing'],au:ME+', Sanidhya, S., Jiang, H., & Chattopadhyay, S.'},
 {id:'fatigue',g:3,ven:'IEEE JBHI · under review',t:'Predicting cognitive fatigue from EEG',q:'Can EEG tell a system that a person is too fatigued to keep going?',
  d:'A Fractional Dynamical Networks ML framework that models EEG as a non-Markovian system and predicts cognitive fatigue in real time with 93.33% accuracy and 0.95 AUROC.',tags:['EEG','dynamical systems','ML'],au:ME+', Riabukhina, D., Akinbami, O., Bogdan, P., & Chattopadhyay, S.'},
 {id:'autonomy',g:3,ven:'Ongoing',t:'Cognitive-aware shared autonomy',q:'When should a car take over from a driver who is not at their best?',
  d:'A shared-autonomy system formalized as a multi-agent POMDP that models the user’s cognitive impairment and chooses control interventions, evaluated in semi-autonomous driving studies.',tags:['POMDP','human-in-the-loop','driving'],au:ME+' et al.'},
 {id:'engagement',g:3,ven:'USC · 2024',t:'Detecting interpersonal engagement',q:'Can a system tell who in a conversation is actually engaged?',
  d:'A multimodal engagement-prediction system fusing synchronized audio, video, behavioural and multi-party context signals, from preprocessing through training and evaluation.',tags:['multimodal ML','audio','video'],au:ME},
 {id:'procrastination',g:0,url:'https://www.computer.org/csdl/proceedings-article/icse/2025/056900a735/251mHgxubJe',ven:'ICSE 2025',t:'Code today, deadline tomorrow',q:'Why does the code wait until tomorrow?',
  d:'A study of when and why software developers procrastinate, and what kind of support would actually help them start.',tags:['survey','interviews','developers'],au:ME+', Zimmermann, T., & Chattopadhyay, S.'},
 {id:'vr',g:0,ven:'UC Davis · 2022–23',t:'Pedagogical agents in VR',q:'Can an autonomous agent teach STEM well at a distance?',
  d:'A custom Unity VR application for Meta Quest 2 to study autonomous pedagogical agents in distance STEM learning, including the environment, interaction logging and study protocol.',tags:['Unity','VR','learning'],au:'Motion Capture Lab, UC Davis'},
 {id:'attention',g:0,ven:'Sharif · 2021–22',t:'EEG and gaze for visual attention',q:'Can brain signals and gaze together predict where attention goes?',
  d:'RNNs and attention-based autoencoders for representation learning on EEG, fused with gaze estimation on the SEED dataset for integrated attention prediction.',tags:['EEG','gaze','representation learning'],au:'DML Lab, Sharif University of Technology'},
];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const desk=document.getElementById('desk');
let html='',last=null,i=0;
for(const p of P){if(p.g!==last){html+=`<div class="group-note" data-g="${p.g}"><span class="num">${p.g?'00'+p.g:'000'}</span><h3>${GROUPS[p.g]}</h3></div>`;last=p.g}
  i++;
  html+=`<article class="sheet" id="${p.id}" data-g="${p.g}">
  <header><span>${p.g?'00'+p.g:'000'} · ${String(i).padStart(2,'0')}</span><span>${esc(p.ven)}</span></header>
  ${p.img?`<img class="ph" src="${p.img}" alt="">`:`<div class="ph" aria-hidden="true"><span>Image</span></div>`}
  <div class="body"><h2>${esc(p.t)}</h2><p class="q">${esc(p.q)}</p><p class="d">${esc(p.d)}</p>
  <div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><p class="au">${p.au.replace(/&(?!amp;)/g,'&amp;')}</p>${p.url?`<a class="paper" href="${p.url}" target="_blank" rel="noopener">Read the paper <span aria-hidden="true">↗</span></a>`:''}</div></article>`}
desk.innerHTML=html;

// filters
const btns=[...document.querySelectorAll('.filters button')];
btns.forEach(b=>b.addEventListener('click',()=>{btns.forEach(x=>x.setAttribute('aria-pressed',x===b));const f=b.dataset.f;
  desk.querySelectorAll('[data-g]').forEach(el=>el.hidden=!(f==='all'||el.dataset.g===f))}));

</script>
</body>
</html>
