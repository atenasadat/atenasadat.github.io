<style>
/* Projects: a simple grid of cards, each with an image, the question, a short summary, and a link to the paper when published.
   To add an image to a card, put the file in assets/projects/ and add img:'assets/projects/NAME.jpg' to that project below. */
.intro{padding:clamp(40px,7vw,90px) 0 clamp(28px,4vw,44px)}
.intro h1{margin:0 0 14px;font-weight:300;font-size:clamp(40px,6vw,72px);letter-spacing:-.02em;line-height:1}
.intro p{margin:0;max-width:36em;color:var(--soft);font-size:19px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 0}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--soft);border-radius:999px;padding:6px 14px;cursor:pointer}
.filters button span{font-family:var(--mono);font-size:11px;margin-right:6px;color:var(--faint)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button[aria-pressed="true"] span{color:inherit;opacity:.7}

.desk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:clamp(24px,3.4vw,44px);padding:clamp(20px,3vw,36px) 0 40px}
.sheet{position:relative;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:6px;padding:20px 22px 22px;scroll-margin-top:30px;transition:border-color .2s ease,background .2s ease}
.sheet:hover{border-color:color-mix(in srgb,var(--ink) 35%,transparent);background:#fff}
.sheet:target{border-color:var(--accent)}
.sheet[hidden]{display:none}
.sheet header{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}

.sheet a:has(>img.ph):hover img{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.sheet .ph{display:grid;place-items:center;width:100%;aspect-ratio:16/9;margin:14px 0 16px;border-radius:4px;border:1px solid var(--line);object-fit:cover;
  background:repeating-linear-gradient(135deg,rgba(43,50,64,.035) 0 10px,transparent 10px 20px),rgba(250,248,244,.6)}
.sheet .ph span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sheet .paper{display:inline-flex;gap:6px;margin-top:14px;font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px}
.sheet .paper:hover{color:var(--accent)}
.sheet h2{margin:0 0 10px;font-weight:400;font-size:21px;line-height:1.25;letter-spacing:-.005em}
.sheet .q{margin:0 0 12px;font-size:18px;line-height:1.4;color:var(--ink)}
.sheet p.d{margin:0 0 14px;font-size:15px;line-height:1.6;color:var(--soft)}
.sheet .tags{display:flex;flex-wrap:wrap;gap:6px}
.sheet .tags span{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;color:var(--soft)}
.sheet .au{margin:12px 0 0;font-size:12.5px;color:var(--faint);line-height:1.5}
.sheet .au b{font-weight:500;color:var(--soft)}
.group-note{scroll-margin-top:24px;grid-column:1/-1;display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding:18px 0 10px;margin-top:10px}
.group-note .num{font-size:22px}
.group-note h3{margin:0;font-weight:400;font-size:22px}
.group-note[hidden]{display:none}
.sheet img.ph{display:block;background:#fff;height:auto;aspect-ratio:auto}
</style>
</head>

 {id:'mentalmodels',g:1,img:'assets/projects/mentalmodels.jpg',full:'assets/projects/mentalmodels-full.jpg',alt:'How developers used Copilot across problem-solving stages, from clarifying the problem to delegating it entirely',ven:'Under review',t:'“Do as I say, not as I code?”',q:'Why do developers describe AI one way and use it another?',

 {id:'paperreading',g:1,img:'assets/projects/paperreading.jpg',alt:'The SURF reader: a paper beside threaded social media discussion about it',url:'https://dl.acm.org/doi/10.1145/3746059.3747647',ven:'UIST 2025',t:'Beyond the page',q:'What if a research paper came with the conversation around it?',
  d:'A reading system that enriches academic papers with social media discussions, placing community commentary next to the passages it is about.',tags:['system','reading','UIST'],au:'Huang, R., Zhao, A. K., '+ME+', Sabouri, S., & Chattopadhyay, S.'},
 {id:'spreadsheets',g:1,url:'https://scholar.google.com/citations?view_op=view_citation&hl=en&user=VW3skGEAAAAJ&citation_for_view=VW3skGEAAAAJ:2osOgNQ5qMEC',img:'assets/projects/spreadsheets.jpg',full:'assets/projects/spreadsheets-full.jpg',alt:'SheetCheck: step-by-step agent actions in a spreadsheet with explanations, branching exploration and version switching',ven:'Under review',t:'Auditing and controlling AI agent actions in spreadsheets',q:'How do we stay in control when an agent edits our data?',
  d:'Tools for auditing and steering what an AI agent does inside a spreadsheet, so users can see, check and undo its actions.',tags:['agents','end-user programming','control'],au:'Sabouri, S., '+ME+', Huang, R., Maladi, S., Eufracio, E., Gulwani, S., & Chattopadhyay, S.'},
 {id:'biases',g:2,img:'assets/projects/biases.jpg',alt:'Comic: an AI fixes a programmer’s collapsing code, and the tired programmer pushes it without checking',url:'https://arxiv.org/abs/2601.08045',ven:'ICSE 2026',t:'Cognitive biases in LLM-assisted software development',q:'Do LLM assistants make developers’ cognitive biases louder?',
  d:'Mixed-methods and controlled observational studies of developers working with LLM assistants, measuring critical thinking, cognitive load and how existing biases get amplified.',tags:['mixed methods','observational study','cognitive bias'],au:ME+', Zhou, X., Sabouri, S., Pandita, R., McGuire, M., & Chattopadhyay, S.'},
 {id:'creativecode',g:2,img:'assets/projects/creativecode.jpg',full:'assets/projects/creativecode-full.jpg',alt:'Study design: randomized programmers, unassisted or with Copilot, analysed through behavioural coding, solution quality and interviews',ven:'Under revision',t:'“Like taking the path of least resistance”',q:'Does autocomplete pull programmers onto the path of least resistance?',

 {id:'genai',g:2,img:'assets/projects/genai-card.jpg',full:'assets/projects/genai-full.jpg',alt:'EEG connectivity on a brain model, unassisted versus LLM-assisted programming, theta band',ven:'In submission',t:'Brain dynamics of LLM-assisted programming',q:'Does working with an AI assistant change how the brain connects during creative problem-solving?',

 {id:'flow',g:2,img:'assets/projects/flow.svg',alt:'',ven:'Ongoing',t:'Neural signatures of creative flow',q:'Can we predict creative flow from neural signals, and protect it?',

 {id:'thinkaloud',g:3,img:'assets/projects/thinkaloud.jpg',full:'assets/projects/thinkaloud-full.jpg',alt:'ATHENA architecture: representation, detection and delivery of nudges',ven:'Under review',t:'Surfacing latent reasoning gaps',q:'Can an agent hear the gap in someone’s reasoning and nudge at the right moment?',

 {id:'fatigue',g:3,img:'assets/projects/fatigue.jpg',full:'assets/projects/fatigue-full.jpg',alt:'FDNML: task, EEG fractional dynamics and the contrastive model for fatigue levels',ven:'IEEE JBHI 2026',t:'Predicting cognitive fatigue from EEG',q:'Can EEG tell a system that a person is too fatigued to keep going?',

 {id:'autonomy',g:3,img:'assets/projects/autonomy.jpg',full:'assets/projects/autonomy-full.jpg',alt:'A participant in the driving simulator, with steering wheel, pedals and monitors',ven:'Ongoing',t:'Cognitive-aware shared autonomy',q:'When should a car take over from a driver who is not at their best?',

 {id:'alignment',g:3,img:'assets/projects/alignment.svg',alt:'',ven:'USC · 2026–',t:'Human-centered alignment for generative reasoning',q:'Can a language model learn to brainstorm the way people do?',
  d:'A GRPO reinforcement learning framework that aligns Qwen 2.5 and Llama 3 generation with human brainstorming patterns, rewarding conceptual synthesis, semantic fidelity and idea exploration, with an end-to-end PyTorch pipeline built on structured think-aloud data.',tags:['GRPO','LoRA','Qwen 2.5 · Llama 3']},
 {id:'verification',g:3,img:'assets/projects/verification.svg',alt:'',ven:'USC · 2026–',t:'Human-AI code comprehension and verification',q:'Does a developer actually understand the code an AI just wrote?',
  d:'A framework that aligns GPT-4o and Claude 3.5 code generation with developers’ mental models to reduce automation bias. A graph-difference method compares compiler-level AST structure with developer attention to catch skipped dependencies and state changes, and Bayesian modeling reconciles what developers think they understood with what they verified.',tags:['AST analysis','Bayesian modeling','automation bias']},
 {id:'engagement',g:3,img:'assets/projects/engagement.svg',alt:'',ven:'USC · 2024',t:'Detecting interpersonal engagement',q:'Can a system tell who in a conversation is actually engaged?',

 {id:'procrastination',g:0,img:'assets/projects/procrastination.jpg',full:'assets/projects/procrastination-full.jpg',alt:'Table of negative effects of procrastination, with how many participants mentioned each',url:'https://www.computer.org/csdl/proceedings-article/icse/2025/056900a735/251mHgxubJe',ven:'ICSE 2025',t:'Code today, deadline tomorrow',q:'Why does the code wait until tomorrow?',

 {id:'vr',g:0,img:'assets/projects/vr.svg',alt:'',ven:'UC Davis · 2022–23',t:'Pedagogical agents in VR',q:'Can an autonomous agent teach STEM well at a distance?',

 {id:'attention',g:0,img:'assets/projects/attention.svg',alt:'',ven:'Sharif · 2021–22',t:'EEG and gaze for visual attention',q:'Can brain signals and gaze together predict where attention goes?',

 {id:'medical',g:0,img:'assets/projects/medical.svg',alt:'',ven:'CommaMed · 2020–22',t:'Deep learning for medical imaging',q:'Can a model find what matters in a medical scan?',
  d:'PyTorch models for medical image segmentation and classification on hospital-sourced data, owned from preprocessing to evaluation in collaboration with product teams.',tags:['PyTorch','segmentation','classification'],au:'R&D internship, CommaMed'},
];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const desk=document.getElementById('desk');
let html='',last=null,i=0;
for(const p of P){if(p.g!==last){html+=`<div class="group-note" id="area-${p.g}" data-g="${p.g}"><span class="num">${p.g?'00'+p.g:'000'}</span><h3>${GROUPS[p.g]}</h3></div>`;last=p.g}
  i++;
  html+=`<article class="sheet" id="${p.id}" data-g="${p.g}">
  <header><span>${p.g?'00'+p.g:'000'} · ${String(i).padStart(2,'0')}</span><span>${esc(p.ven)}</span></header>
  ${p.img?(p.full?`<a href="${p.full}" target="_blank" rel="noopener" aria-label="Open the full figure"><img class="ph" src="${p.img}" alt="${esc(p.alt||'')}" loading="lazy"></a>`:`<img class="ph" src="${p.img}" alt="${esc(p.alt||'')}" loading="lazy">`):`<div class="ph" aria-hidden="true"><span>Image</span></div>`}
  <div class="body"><h2>${esc(p.t)}</h2><p class="q">${esc(p.q)}</p><p class="d">${esc(p.d)}</p>
  <div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>${p.au?`<p class="au">${p.au.replace(/&(?!amp;)/g,'&amp;')}</p>`:''}${p.url?`<a class="paper" href="${p.url}" target="_blank" rel="noopener">Read the paper <span aria-hidden="true">↗</span></a>`:''}</div></article>`}
desk.innerHTML=html;

// filters
const btns=[...document.querySelectorAll('.filters button')];
btns.forEach(b=>b.addEventListener('click',()=>{btns.forEach(x=>x.setAttribute('aria-pressed',x===b));const f=b.dataset.f;
  desk.querySelectorAll('[data-g]').forEach(el=>el.hidden=!(f==='all'||el.dataset.g===f))}));

</script>
